<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 06 Team Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: an LMS course shell. Fixed top bar + left course nav; content area renders Home (banner, announcement, people, To Do), Modules, Assignments, assignment pages with a submission sidebar, People, Grades-style submissions, Resources, Calendar. */
  --bg: #eef1f6; --surface: #ffffff; --ink: #17203a; --muted: #5b6580; --line: #d6dbe6;
  --accent: #2f6fe4; --born: #e8a317; --accent-soft: #e2ebfc; --born-soft: #fdf1d6;
  --good: #1f8a4c; --good-soft: #dcf3e5; --bad: #c2412d; --bad-soft: #fbe3de;
  --code-bg: #f4f6fa; --nav: #17203a; --nav-ink: #c9d1e6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141e; --surface: #1b1f2d; --ink: #e6e9f2; --muted: #9aa3bd; --line: #2c3245;
    --accent: #6c9cff; --born: #f2b938; --accent-soft: #1f2b47; --born-soft: #3a2f14;
    --good: #4cc47e; --good-soft: #163524; --bad: #ff8a73; --bad-soft: #3d1d17; --code-bg: #151925; --nav: #0d0f17; --nav-ink: #aab3cc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141e; --surface: #1b1f2d; --ink: #e6e9f2; --muted: #9aa3bd; --line: #2c3245;
  --accent: #6c9cff; --born: #f2b938; --accent-soft: #1f2b47; --born-soft: #3a2f14;
  --good: #4cc47e; --good-soft: #163524; --bad: #ff8a73; --bad-soft: #3d1d17; --code-bg: #151925; --nav: #0d0f17; --nav-ink: #aab3cc;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.55; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--born); outline-offset: 2px; }
button { font: inherit; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell */
.app { display: grid; grid-template-columns: 236px 1fr; grid-template-rows: 56px 1fr; min-height: 100%; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.logo .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--nav); display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 5px; }
.logo .mark i { background: #6c9cff; border-radius: 1px; }
.logo .mark i.o { background: transparent; }
.logo .mark i.b { background: #f2b938; }
.logo b { font-family: var(--font-display); font-weight: 800; font-size: 17px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; }
.crumbs a { color: var(--accent); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs .sep { opacity: .6; }
.crumbs span:last-child { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.me { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
.me img { width: 28px; height: 28px; border-radius: 50%; }

.sidebar { background: var(--nav); color: var(--nav-ink); padding: 18px 12px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.course { padding: 4px 10px 14px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 8px; }
.course .code { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; color: #f2b938; }
.course .name { color: #fff; font-weight: 600; font-size: 15px; line-height: 1.3; margin-top: 2px; }
.navlink { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; color: var(--nav-ink); text-decoration: none; font-size: 14.5px; font-weight: 500; }
.navlink:hover { background: rgba(255,255,255,.07); color: #fff; }
.navlink[aria-current="page"] { background: rgba(108,156,255,.18); color: #fff; box-shadow: inset 3px 0 0 #6c9cff; }
.navlink .badge { margin-left: auto; font-family: var(--font-mono); font-size: 11px; background: #c2412d; color: #fff; border-radius: 99px; padding: 1px 7px; }
.navgroup { font-family: var(--font-mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: #7f8aa8; padding: 14px 10px 4px; }
.sidebar .foot { margin-top: auto; font-size: 12px; color: #7f8aa8; padding: 10px; }

.content { padding: 24px 28px 64px; min-width: 0; }
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: 22px; }
h1.title { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 3.4vw, 34px); line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; text-wrap: balance; }
h3 { margin: 0; font-size: 16px; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.card > .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card > .bd { padding: 16px 18px; }
.label { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
.banner { border-radius: 10px; padding: 11px 16px; font-size: 14px; border: 1px solid var(--line); background: var(--surface); border-left: 4px solid var(--born); }
.banner[hidden] { display: none; }

/* stage switch */
.stage-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg { border: 0; background: none; color: var(--ink); padding: 6px 11px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.seg + .seg { border-left: 1px solid var(--line); }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* home */
.hero { position: relative; overflow: hidden; border-radius: 14px; background: #17203a; color: #eef1f6; min-height: 168px; display: grid; align-content: end; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .38; }
.hero .in { position: relative; padding: 22px 24px; display: grid; gap: 6px; }
.hero .k { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: #f2b938; text-transform: uppercase; }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 3.6vw, 38px); margin: 0; line-height: 1.05; }
.hero p { margin: 0; opacity: .85; font-size: 14.5px; }
.announce { display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.announce .dot { width: 36px; height: 36px; border-radius: 50%; background: var(--born-soft); color: var(--born); display: grid; place-items: center; }
.announce b { display: block; }
.announce p { margin: 4px 0 0; font-size: 14.5px; }
.announce small { color: var(--muted); }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.person { display: grid; gap: 10px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; border-top: 4px solid var(--accent); transition: transform .15s, box-shadow .15s; }
.person:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(23,32,58,.12); }
.person .top { display: flex; gap: 10px; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 16px; color: #fff; flex: none; }
.avatar.lg { width: 56px; height: 56px; font-size: 22px; border-radius: 12px; }
.person b { font-size: 15px; line-height: 1.25; display: block; }
.person small { color: var(--muted); font-size: 12.5px; display: block; line-height: 1.35; }
.prog { display: grid; gap: 5px; font-size: 12.5px; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--good); }
.person .go { font-size: 13.5px; font-weight: 600; color: var(--accent); }
.todo { list-style: none; margin: 0; padding: 0; display: grid; }
.todo li { border-bottom: 1px solid var(--line); }
.todo li:last-child { border-bottom: 0; }
.todo a { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 11px 18px; text-decoration: none; color: var(--ink); }
.todo a:hover { background: var(--accent-soft); }
.todo .ic { color: var(--bad); margin-top: 2px; }
.todo b { font-size: 14px; font-weight: 500; display: block; line-height: 1.35; }
.todo small { color: var(--muted); font-size: 12.5px; }
.todo .empty { padding: 14px 18px; color: var(--muted); font-size: 14px; }
.dates { display: grid; gap: 8px; font-size: 14px; }
.dates div { display: flex; justify-content: space-between; gap: 10px; }
.dates b { font-variant-numeric: tabular-nums; }
.owner { display: grid; gap: 8px; font-size: 13.5px; }
.owner label { display: grid; gap: 3px; color: var(--muted); }
.owner input { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); }

/* modules */
.module { overflow: hidden; }
.module > .hd { background: var(--code-bg); }
.module > .hd h2 { font-size: 17px; }
.module .meta { font-size: 13px; color: var(--muted); }
.mrow { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.mrow:first-of-type { border-top: 0; }
.mrow:hover { background: var(--accent-soft); }
.mrow .ic { color: var(--muted); }
.mrow b { font-weight: 500; font-size: 14.5px; display: block; }
.mrow small { color: var(--muted); font-size: 12.5px; }
.pill { font-family: var(--font-mono); font-size: 11.5px; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pill.miss { background: var(--bad-soft); color: var(--bad); }
.pill.in { background: var(--good-soft); color: var(--good); }
.pill.part { background: var(--born-soft); color: #9a6a00; }
.pill.due { background: var(--bg); color: var(--muted); }

/* tables */
.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
.t th, .t td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t th { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; background: var(--code-bg); }
.t tr.grp td { background: var(--bg); font-weight: 600; }
.t tr.stagehead td { background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
.t td a { word-break: break-all; }
.t .who { display: flex; gap: 10px; align-items: center; }
.t .who .avatar { width: 32px; height: 32px; font-size: 13px; border-radius: 8px; }
.summary { display: flex; flex-wrap: wrap; gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; min-width: 160px; }
.tile .big { font-family: var(--font-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.tile .sm { font-size: 13px; color: var(--muted); }

/* assignment page */
.ahead { display: flex; gap: 16px; align-items: center; }
.ameta { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; padding: 12px 0 0; border-top: 1px solid var(--line); margin-top: 14px; }
.ameta span b { font-weight: 600; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 18px; }
.tab { border: 0; background: none; padding: 12px 14px; font-size: 14.5px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabpanel { padding: 20px 22px; }
.tabpanel[hidden] { display: none; }
.depends { font-size: 14px; background: var(--born-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 9px; }
.steps li::marker { font-family: var(--font-mono); color: var(--born); font-weight: 500; }
.qs { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14.5px; }
.done { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 14px; }
.done li { padding-left: 24px; position: relative; }
.done li::before { content: ""; position: absolute; left: 2px; top: 4px; width: 12px; height: 12px; border: 1.5px solid var(--muted); border-radius: 3px; }
.present { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 3px; }
.present .label { margin: 0; }
.present small { color: var(--muted); font-size: 12.5px; }
.rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.rcard { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; background: var(--bg); }
.rcard .rn { font-family: var(--font-mono); font-size: 12px; color: var(--born); }
.rnote { margin: 0 0 12px; font-size: 14px; color: var(--muted); max-width: 75ch; }
.src { margin: 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 2px; }
details.sig { border: 1px solid var(--line); border-radius: 10px; background: var(--code-bg); }
details.sig summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 14.5px; display: flex; justify-content: space-between; gap: 10px; align-items: center; list-style: none; }
details.sig summary::-webkit-details-marker { display: none; }
.copy { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.copy:hover { border-color: var(--accent); }
pre { margin: 0; padding: 0 14px 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; white-space: pre; }
.pager { display: flex; justify-content: space-between; gap: 10px; }
.pager a { text-decoration: none; font-size: 14px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; color: var(--ink); }
.pager a:hover { border-color: var(--accent); }
.side { display: grid; gap: 16px; position: sticky; top: 76px; }

/* submission panel */
.slot { display: grid; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
.slot:first-child { border-top: 0; }
.slot .what { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.slot .what b { font-size: 14px; line-height: 1.35; }
.slot .what small { color: var(--muted); font-size: 12.5px; display: block; }
.slot .status { display: flex; gap: 6px; flex-wrap: wrap; }
.items { display: grid; gap: 4px; }
.item { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; font-size: 13.5px; }
.item a { font-weight: 500; word-break: break-all; }
.item .meta { color: var(--muted); font-size: 12px; }
.item button { border: 0; background: none; color: var(--bad); cursor: pointer; font-size: 12px; padding: 0; text-decoration: underline; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.linkrow { display: none; gap: 6px; flex-wrap: wrap; width: 100%; }
.linkrow.open { display: flex; }
.linkrow input { flex: 1; min-width: 160px; font: inherit; font-size: 13.5px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); }
.msg { font-size: 12.5px; color: var(--muted); }
.msg.err { color: var(--bad); }
.msg.okk { color: var(--good); }

/* resources + calendar */
.contract { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.contract .box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 14.5px; display: grid; gap: 8px; align-content: start; }
.contract ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
.flow .node { background: var(--accent-soft); border-radius: 6px; padding: 3px 9px; font-family: var(--font-mono); font-size: 13px; }
.flow .arrow { color: var(--muted); }
.timeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.phasebox { padding: 16px 18px; border-right: 1px solid var(--line); display: grid; gap: 4px; align-content: start; }
.phasebox:last-child { border-right: 0; }
.phasebox .days { font-family: var(--font-mono); font-size: 12.5px; color: var(--born); font-weight: 500; }
.phasebox p { margin: 0; font-size: 14px; color: var(--muted); }
.pr1box { background: var(--born-soft); }
.pastbox { opacity: .55; }
.foot-note { font-size: 13px; color: var(--muted); }

/* ---------- responsive */
.page > *, .grid2 > *, .card, .bd { min-width: 0; }
.menu-btn, .scrim, .mobile-submit { display: none; }
.seg .short { display: none; }
.tabs { overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { white-space: nowrap; }

@media (max-width: 1100px) {
  .app { grid-template-columns: 210px 1fr; }
  .content { padding: 22px 20px 64px; }
  .grid2 { grid-template-columns: minmax(0, 1fr) 290px; }
}
@media (max-width: 980px) {
  .grid2 { grid-template-columns: 1fr; }
  .side { position: static; }
  .mobile-submit { display: flex; position: sticky; bottom: 12px; z-index: 15; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 12px 10px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 14px; }
  .mobile-submit button { border: 0; background: var(--born); color: #17203a; font-weight: 600; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 56px 1fr; }
  .menu-btn { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); cursor: pointer; flex: none; }
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: min(290px, 84vw); height: 100%; z-index: 40; transform: translateX(-105%); transition: transform .22s ease; box-shadow: 8px 0 30px rgba(0,0,0,.3); padding-top: 20px; }
  .app.nav-open .sidebar { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; background: rgba(10,14,25,.45); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .app.nav-open .scrim { opacity: 1; pointer-events: auto; }
  .navlink { padding: 11px 12px; }
  .crumbs { display: none; }
  .me span { display: none; }
}
@media (max-width: 640px) {
  .topbar { gap: 8px; padding: 0 10px; }
  .logo b { display: none; }
  .seg { padding: 7px 10px; }
  .seg .long { display: none; }
  .seg .short { display: inline; }
  .me { display: none; }
  .content { padding: 14px 12px 40px; }
  .page { gap: 16px; }
  .hero { min-height: 140px; }
  .hero .in { padding: 16px; }
  .card > .hd, .card > .bd { padding-left: 14px; padding-right: 14px; }
  .tabpanel { padding: 16px 14px; }
  .tabs { padding: 0 8px; }
  .ahead { align-items: start; }
  .avatar.lg { width: 46px; height: 46px; font-size: 18px; }
  .people { grid-template-columns: 1fr; }
  .mrow { grid-template-columns: auto 1fr; }
  .mrow > .pill, .mrow > span:last-child { grid-column: 2; justify-self: start; }
  .summary .tile { flex: 1 1 140px; min-width: 0; }
  .phasebox { border-right: 0; border-bottom: 1px solid var(--line); }

const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const k of kids) n.append(k instanceof Node ? k : document.createTextNode(k));
  return n;
};

const fmtWhen = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };

/* Look at the first bytes: a file renamed to .pdf (e.g. a saved web page) is refused by storage. */
async function notRealFile(file, ext) {
  const binary = ["pdf", "png", "jpg", "jpeg", "gif", "webp", "mp4"];
  if (!binary.includes(ext)) return null;
  let head = "";
  try { head = new TextDecoder("latin1").decode(await file.slice(0, 1024).arrayBuffer()); } catch (e) { return null; }
  const looksLikePage = /^\s*</.test(head);
  if (ext === "pdf" && !head.includes("%PDF")) {
    return looksLikePage
      ? `${file.name} isn't a real PDF: it's a web page saved with a .pdf name. Open your document (Google Docs, Word or Canva) and use File → Download → PDF, then upload that file. Or paste a Google Drive link instead.`
      : `${file.name} isn't a real PDF (it was probably renamed from another format). Re-export it as PDF from the app you made it in, then upload again, or paste a Google Drive link.`;
  }
  if (looksLikePage) return `${file.name} isn't a real image or video: it's a saved web page. Take the screenshot or export again, or paste a Google Drive link.`;
  return null;
}

async function uploadFile(m, s, file, msg) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if (!UPLOAD_EXT.has(ext)) { setMsg(msg, `${file.name}: this file type can't be uploaded. Export it as PDF, or paste a Google Drive link.`, "err"); return; }
  if (file.size > 20 * 1024 * 1024) { setMsg(msg, `${file.name} is over 20 MB. Paste a Google Drive link instead.`, "err"); return; }
  if (file.size === 0) { setMsg(msg, `${file.name} is empty (0 bytes). Save it again, then upload the new copy.`, "err"); return; }
  const fake = await notRealFile(file, ext);
  if (fake) { setMsg(msg, fake, "err"); return; }
  setMsg(msg, `Uploading ${file.name} to Google Drive…`);
  try {
    const data = await toBase64(file);
    const r = await api({ action: "submit", member: m.id, slot: s.id, kind: "file", fileName: file.name, mime: TYPE_BY_EXT[ext] || file.type || "application/octet-stream", data });
    remember(r);
    setMsg(msg, `${file.name} submitted to Google Drive.`, "okk");
    await loadSubs();
  } catch (e) {
    setMsg(msg, `${file.name} couldn't be uploaded: ${e.message}. Try again, or paste a Google Drive link.`, "err");
  }
}

async function saveLinkItem(m, s, input, msg) {
  const v = input.value.trim();
  if (!/^https?:\/\/\S+\.\S+/i.test(v)) { setMsg(msg, "Paste a full link starting with https://", "err"); return; }
  setMsg(msg, "Saving link…");
  try {
    const r = await api({ action: "submit", member: m.id, slot: s.id, kind: "link", link: v });
    remember(r);
    input.value = "";
    setMsg(msg, "Link submitted.", "okk");
    await loadSubs();
  } catch (e) {
    setMsg(msg, `Couldn't save the link: ${e.message}`, "err");
  }
}

async function removeItem(it) {
  try {
    await api({ action: "remove", id: it.id, token: myTokens[it.id] });
    delete myTokens[it.id]; saveTokens();
    await loadSubs();
  } catch (e) {
    alertBanner("Couldn't remove that item: " + e.message);
  }
}

function setMsg(node, text, cls = "") { node.textContent = text; node.className = "msg" + (cls ? " " + cls : ""); }
function alertBanner(text) { const b = $("#connBanner"); b.textContent = text; b.className = "banner warn"; b.hidden = false; }

async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (e) {
    const pre = btn.closest("details").querySelector("pre");
    const r = document.createRange(); r.selectNodeContents(pre);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    btn.textContent = "Selected: press Ctrl+C";
  }
  setTimeout(() => { btn.textContent = "Copy starter file"; }, 2500);
}

/* submission slot (sidebar version) */

  const msg = el("span", { class: "msg" });
  const fileInput = el("input", { type: "file", id: `file-${m.id}-${s.id}`, style: "display:none", accept: ".py,.md,.txt,.csv,.json,.pdf,.png,.jpg,.jpeg,.gif,.webp,.mp4,.docx,.pptx,.xlsx,.zip", multiple: "" });
  const uploadBtn = el("button", { class: "btn", type: "button" }, items.length ? "Upload another" : "Upload file");
  const linkBtn = el("button", { class: "btn ghost", type: "button" }, "Paste a link");
  const linkInput = el("input", { type: "url", id: `link-${m.id}-${s.id}`, placeholder: "https://drive.google.com/…", "aria-label": `Link for ${s.title}` });
  const saveLink = el("button", { class: "btn", type: "button" }, "Save");
  const linkRow = el("div", { class: "linkrow" }, linkInput, saveLink);
  uploadBtn.disabled = !(db && assets);

  uploadBtn.addEventListener("click", () => fileInput.click());

  saveLink.addEventListener("click", () => saveLinkItem(m, s, linkInput, msg));

  row.append(el("div", { class: "actions" }, uploadBtn, linkBtn, fileInput, linkRow, msg));
  return row;
}

  if (MEMBERS.some(m => m.id === h)) return { view: "member", id: h };

  return { view: "home", id: null };
}

function renderAll() {

  const msgs = {};
  document.querySelectorAll(".slot").forEach(sl => { const mm = sl.querySelector(".msg"); if (mm && mm.textContent) msgs[sl.id] = [mm.textContent, mm.className]; });
  const focusId = document.activeElement && document.activeElement.id;

  renderSidebar(); renderTop();

  ({ home: viewHome, modules: viewModules, assignments: viewAssignments, people: viewPeople, folder: viewFolder, rules: viewRules, timeline: viewTimeline, member: viewMember })[route.view](page);

  if (focusId) { const f = document.getElementById(focusId); if (f) f.focus(); }
  labelTables();
  startLife();

function labelTables() {
  document.querySelectorAll("table.t").forEach(t => {
    const heads = [...t.querySelectorAll("thead th")].map(th => th.textContent);
    t.querySelectorAll("tbody tr").forEach(tr => {

      if (cells.length === 1) return;
      cells.forEach((td, i) => { if (heads[i]) td.setAttribute("data-label", heads[i]); if (!td.textContent.trim() || td.textContent.trim() === "—" && i > 1) td.classList.add("blank"); });
    });
  });
}

/* ================================================================== live Game of Life in the course banner */
let life = null;
function startLife() {
  const cv = document.getElementById("life");
  if (!cv) return;
  const S = 12, r = cv.getBoundingClientRect();
  cv.width = r.width; cv.height = r.height;
  const cols = Math.ceil(r.width / S), rows = Math.ceil(r.height / S);
  if (!life || life.cols !== cols || life.rows !== rows) {
    life = { cols, rows, g: new Uint8Array(cols * rows).map(() => Math.random() < 0.22 ? 1 : 0), born: new Uint8Array(cols * rows) };
    for (let k = 0; k < 6; k++) lifeStep();
  }
  lifeDraw();
}
function lifeStep() {
  const { cols, rows, g } = life, n = new Uint8Array(cols * rows), born = new Uint8Array(cols * rows);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    let c = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const yy = y + dy, xx = x + dx;
      if ((dx || dy) && yy >= 0 && yy < rows && xx >= 0 && xx < cols) c += g[yy * cols + xx];
    }
    const i = y * cols + x;
    n[i] = (c === 3 || (g[i] && c === 2)) ? 1 : 0;
    if (n[i] && !g[i]) born[i] = 1;
  }
  life.g = n; life.born = born;
  if (!n.some(v => v)) life.g = new Uint8Array(cols * rows).map(() => Math.random() < 0.22 ? 1 : 0);
}
function lifeDraw() {
  const cv = document.getElementById("life"); if (!cv || !life) return;
  const ctx = cv.getContext("2d"), S = 12;
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let i = 0; i < life.g.length; i++) if (life.g[i]) {
    ctx.fillStyle = life.born[i] ? "#f2b938" : "#6c9cff";
    ctx.fillRect((i % life.cols) * S + 1, Math.floor(i / life.cols) * S + 1, S - 2, S - 2);
  }
}
if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  setInterval(() => { if (life && document.getElementById("life")) { lifeStep(); lifeDraw(); } }, 280);
}
window.addEventListener("resize", () => { if (document.getElementById("life")) startLife(); });

async function api(body) {
  let res;
  try {
    res = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  } catch (e) { throw new Error("no connection to the submission folder"); }
  let out = null;
  try { out = await res.json(); } catch (e) { throw new Error("the submission folder didn't answer properly"); }
  if (!out || !out.ok) throw new Error((out && out.error) || "the submission folder refused it");
  return out;
}

async function loadSubs() {

  if (out.config && /^\d{4}-\d{2}-\d{2}$/.test(out.config.pr1 || "")) pr1Date = out.config.pr1;
  renderAll();
}
